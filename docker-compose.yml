# The Meshtastic LLM bridge and its Ollama, as containers. Full instructions: docs/setup.md ("Run with Docker").
#
#   Try it with no radio and no Ollama:  docker compose --profile demo up demo     then open http://127.0.0.1:8080/
#   The real thing:                      docker compose up -d                      (needs a radio: see below)
#
# By default the dashboard has NO LOGIN here, shows message text and lets whoever opens it send on your radio, so it is published on
# this computer's loopback only ("127.0.0.1:...").
#   Login (dashboard password):  add  -f docker-compose.login.yml  (the password hash is a Compose secret, never an environment variable).
#   Another computer or a phone: needs that login AND MESHLLM_WEB_BIND + MESHLLM_ALLOWED_HOSTS in .env (see .env.example). Without the login
#                                the container REFUSES TO START when MESHLLM_WEB_BIND is anything but 127.0.0.1 / ::1.
# WARNING: do NOT hand-edit the "ports:" address to 0.0.0.0, to a LAN or public IP, or drop it so Docker publishes on every interface:
# the container cannot see that, so the checks above would not run and anyone who can reach the port would control your radio and
# read your messages. Docker also edits the firewall itself, so a published port on 0.0.0.0 is reachable from the network even if a
# host firewall such as ufw says otherwise. Use MESHLLM_WEB_BIND, which the container checks.
#
# Radio: pick ONE way.
#   USB (Linux hosts only):  docker compose -f docker-compose.yml -f docker-compose.usb.yml up -d
#   Wi-Fi/TCP (any host):    set MESHLLM_TCP=<radio address> in .env (see .env.example). NOT yet tested on real hardware.
#   Bluetooth does NOT work in a container (it needs the host's BlueZ and D-Bus): run the bridge on the host for that.
#   Failover:                set MESHLLM_FALLBACK=usb:/dev/ttyUSB1,tcp:<address> (priority order after the primary); no ble: entries here.

x-hardening: &hardening
  # The bridge needs none of root's powers: it reads a USB device through a group, a socket, and writes under /data and /tmp.
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  read_only: true            # the image's files cannot be changed from inside; the writable places are /data (volume) and /tmp
  tmpfs: ["/tmp"]
  restart: unless-stopped

services:
  bridge:
    build: .
    <<: *hardening
    depends_on: [ollama]
    environment:
      MESHLLM_OLLAMA_URL: "http://ollama:11434"
      MESHLLM_TCP: "${MESHLLM_TCP:-}"
      MESHLLM_FALLBACK: "${MESHLLM_FALLBACK:-}"
      MESHLLM_MODEL: "${MESHLLM_MODEL:-}"
      MESHLLM_EXTRA_ARGS: "${MESHLLM_EXTRA_ARGS:-}"
      # The entrypoint is told where the port is published so it can refuse a network-facing dashboard without a login (see above)
      MESHLLM_PUBLISH_ADDR: "${MESHLLM_WEB_BIND:-127.0.0.1}"
      MESHLLM_ALLOWED_HOSTS: "${MESHLLM_ALLOWED_HOSTS:-}"
    volumes:
      # The database (audit.db), the backups and the map-tile cache all live in this volume. It survives `docker compose down`
      # (but not `docker compose down -v`).
      - meshllm-data:/data
    ports:
      # Loopback unless you opt in with MESHLLM_WEB_BIND (needs the login, see the top of this file); the same variable is handed to the
      # container above, which refuses to start on a non-loopback address without a login. Inside the container the app listens on
      # 0.0.0.0:8080; this line decides who can reach it. MESHLLM_WEB_PORT in .env changes the host port number.
      - "${MESHLLM_WEB_BIND:-127.0.0.1}:${MESHLLM_WEB_PORT:-8080}:8080"

  ollama:
    # The AI model server. No `ports:` on purpose: only the bridge (on this Compose network) talks to it. Pulling a model:
    #   docker compose exec ollama ollama pull llama3.2:3b
    image: ollama/ollama:0.35.1
    restart: unless-stopped
    volumes:
      - ollama-models:/root/.ollama
    # Optional, NVIDIA GPU (needs the NVIDIA Container Toolkit on the host). Remove the # signs:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  demo:
    # A simulated mesh with a built-in scripted model: no radio, no Ollama, nothing is transmitted and nothing is kept.
    #   docker compose --profile demo up demo
    # It uses the same host port as `bridge`, so run one or the other.
    build: .
    profiles: [demo]
    <<: *hardening
    restart: "no"
    command: ["--demo", "--demo-scripted"]
    ports:
      # The demo has a send box and no login, so its address is fixed to this computer's loopback: no variable can change it.
      - "127.0.0.1:${MESHLLM_WEB_PORT:-8080}:8080"

volumes:
  meshllm-data:
  ollama-models:
