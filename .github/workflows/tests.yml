name: tests

on:
  push:
    branches: [main]
  pull_request:

# The tests only read the repository, so the token gets no write access at all.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run the test suite (radio and Ollama are faked)
        run: python scripts/run_tests.py -v

  # Builds the container image and smoke-tests it. Nothing is pushed to a registry (no login, no push).
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build the image
        run: docker build --tag meshllm-ci .
      - name: Smoke test the demo container
        run: |
          set -eu
          trap 'docker logs meshllm-ci-demo || true; docker rm -f meshllm-ci-demo >/dev/null 2>&1 || true' EXIT
          # publish on the runner's loopback only, like docker-compose.yml does; a read-only root and no capabilities, like the compose file
          docker run -d --name meshllm-ci-demo --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges:true \
            -p 127.0.0.1:18080:8080 meshllm-ci --demo --demo-scripted
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:18080/api/status | grep -q '"connected": true'; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:18080/api/status | grep -q '"connected": true'
          uid=$(docker exec meshllm-ci-demo id -u)
          echo "container user id: $uid"
          test "$uid" != "0"
          for i in $(seq 1 30); do
            health=$(docker inspect --format '{{.State.Health.Status}}' meshllm-ci-demo)
            if [ "$health" = healthy ]; then break; fi
            sleep 2
          done
          echo "health: $health"
          test "$health" = healthy
          docker stop -t 10 meshllm-ci-demo
          test "$(docker inspect --format '{{.State.ExitCode}}' meshllm-ci-demo)" = 0
      - name: The compose files are valid
        run: |
          docker compose config -q
          docker compose --profile demo config -q
          docker compose -f docker-compose.yml -f docker/docker-compose.usb.yml config -q
          # the dashboard-login override needs the path of the hash file, and says so when it is missing
          if docker compose -f docker-compose.yml -f docker/docker-compose.login.yml config -q 2>/dev/null; then echo "login override accepted a missing MESHLLM_ADMIN_HASH_FILE"; exit 1; fi
          MESHLLM_ADMIN_HASH_FILE=/nonexistent/admin.hash docker compose -f docker-compose.yml -f docker/docker-compose.login.yml config -q
          MESHLLM_ADMIN_HASH_FILE=/nonexistent/admin.hash docker compose -f docker-compose.yml -f docker/docker-compose.login.yml -f docker/docker-compose.usb.yml config -q
      - name: Smoke test the dashboard login (hash from a Compose secret file)
        run: |
          set -eu
          export COMPOSE_PROJECT_NAME=meshllm-ci-login MESHLLM_WEB_PORT=18081
          dc="docker compose -f docker-compose.yml -f docker/docker-compose.login.yml"
          dir=$(mktemp -d)
          pw=$(python3 -c 'import secrets; print(secrets.token_urlsafe(24))')      # a throwaway password for this run only
          # the project's own helper makes the hash; the file is mode 600 and owned by the runner user, exactly the unreadable-secret case
          (umask 077; PW="$pw" python3 -c 'import os; from meshllm import passwords; print(passwords.hash_password(os.environ["PW"]))' > "$dir/admin.hash")
          export MESHLLM_ADMIN_HASH_FILE="$dir/admin.hash"
          trap '$dc logs bridge || true; $dc down -v >/dev/null 2>&1 || true' EXIT
          $dc up -d --build --no-deps bridge          # no Ollama: the dashboard is up without it
          for i in $(seq 1 45); do
            health=$(docker inspect --format '{{.State.Health.Status}}' meshllm-ci-login-bridge-1)
            if [ "$health" = healthy ]; then break; fi
            sleep 2
          done
          echo "health: $health"
          test "$health" = healthy
          base=http://127.0.0.1:18081
          test "$(curl -s -o /dev/null -w '%{http_code}' $base/api/status)" = 401
          curl -fsS -c "$dir/jar" -H "Origin: $base" -H 'Content-Type: application/json' -d "{\"account\":\"admin\",\"password\":\"$pw\"}" $base/api/login >/dev/null
          test "$(curl -s -b "$dir/jar" -o /dev/null -w '%{http_code}' $base/api/status)" = 200
          # the hash is in a secret file, not in the container's configuration
          if docker inspect meshllm-ci-login-bridge-1 | grep -q scrypt; then echo "the password hash is visible in docker inspect"; exit 1; fi
          # PID 1 (the bridge) is not root and holds no capabilities; the root file system is read-only
          docker exec meshllm-ci-login-bridge-1 grep -E '^(Uid|CapInh|CapPrm|CapEff|CapAmb)' /proc/1/status | tee "$dir/proc"
          grep -q '^Uid:[[:space:]]10001' "$dir/proc"
          for cap in CapInh CapPrm CapEff CapAmb; do grep -q "^$cap:[[:space:]]0000000000000000" "$dir/proc"; done
          test "$(docker inspect --format '{{.HostConfig.ReadonlyRootfs}}' meshllm-ci-login-bridge-1)" = true
          test "$(docker port meshllm-ci-login-bridge-1 8080/tcp)" = "127.0.0.1:18081"
      - name: The image refuses a network-facing dashboard without a login
        run: |
          set -eu
          for extra in "" "-e MESHLLM_ALLOWED_HOSTS=192.0.2.10"; do
            rc=0
            docker run --rm --read-only --tmpfs /tmp --cap-drop ALL -e MESHLLM_PUBLISH_ADDR=192.0.2.10 $extra meshllm-ci || rc=$?
            echo "exit code: $rc"
            test "$rc" = 78
          done
