name: release

# Publishes a GitHub Release when a version tag such as v0.1.0 is pushed. How to cut one: docs/releasing.md.
#
#   verify    the tag is `v` + meshllm.__version__, docs/CHANGELOG.md has a section for it, and the tagged commit is on main
#   test      the whole test suite
#   build     the packaged program for Linux, Windows and macOS (the package.yml workflow, with its smoke tests)
#   checksums SHA256SUMS of the archives, and a build-provenance attestation for each (the only job with id-token / attestations)
#   publish   `gh release create` with the notes from docs/CHANGELOG.md and the archives (the only job that can write to the repository)
#
# Nothing here uses a secret other than the workflow's own short-lived token. A tag whose checks fail publishes nothing.
on:
  push:
    tags:
      - "v*.*.*"

# Every job reads the repository and nothing else; the jobs that need more say so themselves.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0          # the whole history, so main can be compared with the tagged commit
      - name: The tag matches the version and the changelog
        env:
          TAG: ${{ github.ref_name }}
        run: python3 scripts/release_check.py check "$TAG"
      - name: The tagged commit is on main
        env:
          TAGGED_COMMIT: ${{ github.sha }}
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$TAGGED_COMMIT" refs/remotes/origin/main; then
            echo "error: $TAGGED_COMMIT is not on main; merge the release pull request first and tag the merge commit" >&2
            exit 1
          fi

  test:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run the test suite (radio and Ollama are faked)
        run: python scripts/run_tests.py -v

  build:
    needs: [verify, test]
    uses: ./.github/workflows/package.yml

  checksums:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write         # the attestation is signed with this run's identity
      attestations: write     # and stored with the repository
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: meshllm-*
          path: release
          merge-multiple: true
      - name: SHA256SUMS
        working-directory: release
        run: |
          set -eu
          ls -l
          sha256sum meshllm-*.tar.gz meshllm-*.zip > SHA256SUMS
          cat SHA256SUMS
          test "$(wc -l < SHA256SUMS)" = 3
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            release/meshllm-*.tar.gz
            release/meshllm-*.zip
      - uses: actions/upload-artifact@v7
        with:
          name: release-files
          path: release/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: checksums
    runs-on: ubuntu-latest
    permissions:
      contents: write         # creating the release is the only thing that writes
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: release-files
          path: release
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          version="${TAG#v}"
          python3 scripts/release_check.py notes "$version" > notes.md
          flags=""
          case "$version" in *-*) flags="--prerelease" ;; esac      # 1.0.0-rc.1 and the like are pre-releases
          gh release create "$TAG" release/meshllm-*.tar.gz release/meshllm-*.zip release/SHA256SUMS \
            --verify-tag --title "Meshtastic LLM Bridge $version" --notes-file notes.md $flags
